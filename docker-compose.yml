services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Persiste a fila de revisão (data/fila), os exports e o certificado.
      # É trabalho de gente pendente: não pode morrer com o container.
      - ./data:/app/data
    environment:
      # Aponta para o PostgreSQL do BibLivre 5 que roda na máquina hospedeira
      # (instalador Windows/Java-Tomcat-Postgres). Sem isso a checagem de ISBN
      # já catalogado fica desligada e todo livro bipado vira obra nova.
      - PGHOST=${PGHOST:-host.docker.internal}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE:-biblivre4}
      - PGUSER=${PGUSER:-biblivre}
      # `abracadabra` é o default público do BibLivre (está no context.xml do
      # projeto). Numa instalação com senha própria, defina PGPASSWORD num
      # arquivo .env ou secret — nunca edite a senha real aqui.
      - PGPASSWORD=${PGPASSWORD:-abracadabra}
      - BIBLIVRE_DB_SCHEMA=${BIBLIVRE_DB_SCHEMA:-single}
    extra_hosts:
      # No Docker Desktop `host.docker.internal` já resolve; no Docker de Linux
      # não, e sem esta linha o container não enxergaria o Postgres do host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

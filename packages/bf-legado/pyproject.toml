[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biblio-legado"
version = "0.1.0"
description = "Leitura do backup .bkp do Biblioteca Facil (formato proprietario)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

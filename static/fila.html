<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fila de revisão — Catalogação por ISBN</title>
<style>
:root{
  --bg:#131629; --sup:#1b2140; --sup2:#232a4f; --linha:#2e3763;
  --txt:#e8ebf5; --txt2:#98a0c0; --txt3:#6b739b;
  --azul:#4b9fe1; --verde:#2ecc71; --ambar:#f0a92b; --vermelho:#e8584f; --roxo:#9b7ede;
  --raio:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--azul);text-decoration:none}

/* ---- topo ---- */
header{background:var(--sup);border-bottom:1px solid var(--linha);padding:10px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30}
header h1{font-size:15px;font-weight:600;letter-spacing:.2px}
header .sep{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--sup2);color:var(--txt2);border:1px solid var(--linha)}
.pill .ponto{width:7px;height:7px;border-radius:50%;background:var(--txt3)}
.pill.on .ponto{background:var(--verde);box-shadow:0 0 6px var(--verde)}
.pill.off .ponto{background:var(--ambar)}
.pill:hover{border-color:var(--azul)}
.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;background:var(--sup2);color:var(--txt);border:1px solid var(--linha);transition:.12s}
.btn:hover:not(:disabled){border-color:var(--azul);background:var(--linha)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primario{background:var(--azul);border-color:var(--azul);color:#08101f}
.btn.ok{background:var(--verde);border-color:var(--verde);color:#062616}
.btn.perigo{background:transparent;border-color:#5c2b2b;color:var(--vermelho)}
.btn.perigo:hover{background:rgba(232,88,79,.12);border-color:var(--vermelho)}
.btn.pequeno{padding:5px 9px;font-size:12px}

main{max-width:1400px;margin:0 auto;padding:18px 20px 140px}

/* ---- indicadores ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--sup);border:1px solid var(--linha);border-radius:var(--raio);padding:12px 14px}
.tile .n{font-size:26px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.tile .r{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.tile .obs{font-size:11px;color:var(--txt3);margin-top:4px}
.tile.destaque{border-color:rgba(75,159,225,.45)}
.tile.destaque .n{color:var(--azul)}
.tile.alerta{border-color:rgba(240,169,43,.4)}
.tile.alerta .n{color:var(--ambar)}
.tile.verde .n{color:var(--verde)}

/* ---- barra de ferramentas ---- */
.ferramentas{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.busca{position:relative;flex:1;min-width:220px;max-width:380px}
.busca input{width:100%;padding:9px 12px 9px 32px;border-radius:8px;border:1px solid var(--linha);background:var(--sup);font-size:13px}
.busca input:focus{outline:none;border-color:var(--azul)}
.busca::before{content:"⌕";position:absolute;left:11px;top:7px;color:var(--txt3);font-size:16px}
.chips{display:flex;gap:4px;background:var(--sup);border:1px solid var(--linha);border-radius:8px;padding:3px}
.chip{padding:6px 11px;border-radius:6px;font-size:12.5px;color:var(--txt2);white-space:nowrap}
.chip.ativo{background:var(--sup2);color:var(--txt);font-weight:600}
.chip .c{font-size:11px;color:var(--txt3);margin-left:4px;font-variant-numeric:tabular-nums}
.chip.ativo .c{color:var(--azul)}

/* ---- tabela ---- */
.quadro{background:var(--sup);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden}
.linha-cab,.linha{display:grid;grid-template-columns:34px 40px minmax(200px,2.6fr) 132px 168px 78px 108px 96px;gap:10px;align-items:center;padding:9px 14px}
.linha-cab{background:var(--sup2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt2);border-bottom:1px solid var(--linha);position:sticky;top:49px;z-index:20}
.linha{border-bottom:1px solid rgba(46,55,99,.5)}
.linha:last-child{border-bottom:none}
.linha:hover{background:rgba(255,255,255,.022)}
.linha.sel{background:rgba(75,159,225,.09)}
.linha.exportado{opacity:.5}
.linha.ignorado{opacity:.45}
.capa{width:32px;height:46px;border-radius:3px;object-fit:cover;background:var(--sup2);display:block}
.capa.vazia{display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--txt3)}
.titulo{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titulo.faltando{color:var(--ambar);font-weight:500;font-style:italic}
.sub{font-size:12px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isbn{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:12px;color:var(--txt2)}
.fonte{font-size:10.5px;color:var(--txt3)}
.destino{font-size:12px;line-height:1.3}
.destino .b{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.3px}
.b.nova{background:rgba(155,126,222,.16);color:var(--roxo)}
.b.existe{background:rgba(46,204,113,.14);color:var(--verde)}
.b.desconhecido{background:rgba(107,115,155,.16);color:var(--txt3)}
.destino small{display:block;color:var(--txt3);font-size:11px;margin-top:1px}
.qtd{display:flex;align-items:center;gap:2px}
.qtd button{width:22px;height:24px;border-radius:5px;background:var(--sup2);color:var(--txt2);font-size:14px;line-height:1}
.qtd button:hover{color:var(--txt);background:var(--linha)}
.qtd input{width:34px;text-align:center;padding:3px 0;border-radius:5px;border:1px solid var(--linha);background:var(--bg);font-size:13px;font-variant-numeric:tabular-nums}
.est{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:5px;text-align:center;display:inline-block}
.est.pendente{background:rgba(240,169,43,.15);color:var(--ambar)}
.est.revisado{background:rgba(46,204,113,.15);color:var(--verde)}
.est.exportado{background:rgba(75,159,225,.15);color:var(--azul)}
.est.ignorado{background:rgba(107,115,155,.16);color:var(--txt3)}
.acoes{display:flex;gap:4px;justify-content:flex-end}
.icone{width:26px;height:26px;border-radius:6px;color:var(--txt3);font-size:14px;display:flex;align-items:center;justify-content:center}
.icone:hover{background:var(--sup2);color:var(--txt)}
.icone.perigo:hover{color:var(--vermelho)}
.vazio{padding:52px 20px;text-align:center;color:var(--txt3)}
.vazio .g{font-size:34px;opacity:.4;margin-bottom:8px}

/* ---- editor embutido ---- */
.editor{grid-column:1/-1;background:var(--bg);border:1px solid var(--linha);border-radius:8px;padding:14px;margin:2px 0 8px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.campo label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3);margin-bottom:3px}
.campo input{width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--linha);background:var(--sup);font-size:13px}
.campo input:focus{outline:none;border-color:var(--azul)}
.editor-pe{display:flex;gap:8px;align-items:center;margin-top:12px}
.editor-pe .sep{flex:1}

/* ---- barra de selecao ---- */
#barra-sel{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--sup2);border:1px solid var(--azul);border-radius:12px;padding:9px 12px;display:none;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:35}
#barra-sel.on{display:flex}
#barra-sel .n{font-size:13px;font-weight:600;margin-right:4px}

/* ---- rodape de export ---- */
#rodape{position:fixed;left:0;right:0;bottom:0;background:var(--sup);border-top:1px solid var(--linha);padding:12px 20px;z-index:32}
.rodape-in{max-width:1400px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rodape-in .sep{flex:1}
label.check{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--txt2);cursor:pointer}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--azul);cursor:pointer}
#senha{padding:8px 10px;border-radius:8px;border:1px solid var(--linha);background:var(--bg);font-size:13px;width:190px}
#msg{font-size:12.5px;color:var(--txt2);max-width:100%;flex-basis:100%}
#msg.ok{color:var(--verde)} #msg.erro{color:var(--vermelho)} #msg.aviso{color:var(--ambar)}

/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(6,8,18,.78);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal-cx{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:86vh;overflow:auto}
.modal-cx h3{font-size:15px;margin-bottom:4px}
.modal-cx p.dica{font-size:12.5px;color:var(--txt3);margin-bottom:14px}
.modal-pe{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.resumo{background:var(--bg);border:1px solid var(--linha);border-radius:8px;padding:12px;margin-top:12px;font-size:12.5px;max-height:230px;overflow:auto}
.resumo b{color:var(--txt)}
.resumo .l{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid rgba(46,55,99,.4)}
.resumo .l:last-child{border:none}

@media(max-width:1000px){
  .linha-cab,.linha{grid-template-columns:30px 36px minmax(140px,2fr) 118px 148px 74px 90px}
  .linha-cab span:nth-child(8),.acoes{display:none}
}
</style>
</head>
<body>

<header>
  <h1>Fila de revisão</h1>
  <a href="/" class="btn pequeno">← Escanear</a>
  <span class="sep"></span>
  <button class="pill" id="pill-banco" onclick="abrirBanco()"><span class="ponto"></span><span id="pill-banco-txt">verificando…</span></button>
  <button class="btn pequeno" onclick="recarregar(true)" title="Recarregar e reconsultar o acervo">↻ Atualizar</button>
</header>

<main>
  <div class="tiles" id="tiles"></div>

  <div class="ferramentas">
    <div class="busca"><input id="busca" placeholder="Buscar por título, autor, editora, ISBN…" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
    <label class="check"><input type="checkbox" id="so-acervo"> só já no acervo</label>
    <span style="flex:1"></span>
    <select id="ordem" class="btn pequeno" style="padding:7px 10px">
      <option value="recente">Mais recentes</option>
      <option value="antigo">Mais antigos</option>
      <option value="titulo">Título A→Z</option>
      <option value="qtd">Mais exemplares</option>
      <option value="destino">Obras novas primeiro</option>
    </select>
  </div>

  <div class="quadro">
    <div class="linha-cab">
      <span><input type="checkbox" id="sel-todos" onchange="selecionarTodos(this.checked)"></span>
      <span></span><span>Obra</span><span>ISBN</span><span>Destino no BibLivre</span>
      <span>Exemp.</span><span>Situação</span><span></span>
    </div>
    <div id="linhas"></div>
  </div>
</main>

<div id="barra-sel">
  <span class="n"><span id="sel-n">0</span> selecionados</span>
  <button class="btn pequeno ok" onclick="acao('revisado')">✓ Revisado</button>
  <button class="btn pequeno" onclick="acao('pendente')">↺ Pendente</button>
  <button class="btn pequeno" onclick="acao('ignorado')">⊘ Ignorar</button>
  <button class="btn pequeno perigo" onclick="acao('remover')">🗑 Remover</button>
  <button class="btn pequeno" onclick="limparSelecao()">Limpar</button>
</div>

<div id="rodape">
  <div class="rodape-in">
    <label class="check"><input type="checkbox" id="executar" onchange="document.getElementById('senha').style.display=this.checked?'block':'none'"> Gravar no BibLivre</label>
    <input type="password" id="senha" placeholder="Senha do Postgres" style="display:none">
    <span class="sep"></span>
    <span id="previa" style="font-size:12.5px;color:var(--txt2)"></span>
    <button class="btn primario" id="btn-exportar" onclick="confirmarExport()">Exportar →</button>
  </div>
  <div class="rodape-in"><div id="msg"></div></div>
</div>

<!-- confirmacao de export -->
<div class="modal" id="modal-export" onclick="if(event.target===this)fechar('modal-export')">
  <div class="modal-cx">
    <h3 id="exp-titulo">Confirmar exportação</h3>
    <p class="dica" id="exp-dica"></p>
    <div class="resumo" id="exp-resumo"></div>
    <div class="modal-pe">
      <button class="btn" onclick="fechar('modal-export')">Cancelar</button>
      <button class="btn ok" id="exp-ok" onclick="exportar()">Confirmar</button>
    </div>
  </div>
</div>

<!-- conexao com o banco -->
<div class="modal" id="modal-banco" onclick="if(event.target===this)fechar('modal-banco')">
  <div class="modal-cx">
    <h3>Conexão com o BibLivre</h3>
    <p class="dica">Sem ela o sistema não sabe quais ISBNs já estão catalogados e trata todo livro como obra nova. A senha fica só na memória do servidor.</p>
    <div class="grade">
      <div class="campo"><label>Host</label><input id="db-host" value="localhost"></div>
      <div class="campo"><label>Banco</label><input id="db-nome" value="biblivre4"></div>
      <div class="campo"><label>Usuário</label><input id="db-user" value="biblivre"></div>
      <div class="campo"><label>Schema</label><input id="db-schema" value="single"></div>
      <div class="campo" style="grid-column:1/-1"><label>Senha</label><input id="db-senha" type="password" placeholder="senha do Postgres"></div>
    </div>
    <div id="db-msg" style="font-size:12.5px;margin-top:10px;color:var(--txt2)"></div>
    <div class="modal-pe">
      <button class="btn" onclick="fechar('modal-banco')">Fechar</button>
      <button class="btn primario" onclick="conectarBanco()">Conectar e reavaliar fila</button>
    </div>
  </div>
</div>

<script>
const ESTADOS=[['todos','Todos'],['pendente','Pendentes'],['revisado','Revisados'],['exportado','Exportados'],['ignorado','Ignorados']];
let itens=[], stats=null, filtro='pendente', selecao=new Set(), editando=null, banco={conectado:false};

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- carga ----------
async function recarregar(reconsultar){
  if(reconsultar && banco.conectado){ msg('Reconsultando o acervo…'); await fetch('/api/fila/reconsultar',{method:'POST'}).catch(()=>{}); }
  const [f,s,b]=await Promise.all([
    fetch('/api/fila').then(r=>r.json()),
    fetch('/api/fila/stats').then(r=>r.json()),
    fetch('/api/db').then(r=>r.json()).catch(()=>({}))
  ]);
  itens=f.itens||[]; stats=s;
  banco={conectado:(b.indexados||0)>0||!!b.configurado&&!b.erro, indexados:b.indexados||0, erro:b.erro||'', cfg:b.config||{}};
  pintarBanco(); pintarTiles(); pintar();
  if(reconsultar) msg('Atualizado.','ok');
}

function pintarBanco(){
  const p=$('pill-banco'), t=$('pill-banco-txt');
  if(banco.indexados>0){ p.className='pill on'; t.textContent=`Acervo: ${banco.indexados.toLocaleString('pt-BR')} ISBNs`; }
  else if(banco.erro){ p.className='pill off'; t.textContent='Banco: erro — configurar'; }
  else { p.className='pill off'; t.textContent='Banco desconectado'; }
}

function pintarTiles(){
  const s=stats, alertas=s.sem_metadados+s.isbn_repetido;
  const t=[
    {n:s.a_exportar, r:'A exportar', obs:`${s.exemplares} exemplares`, cls:'destaque'},
    {n:s.por_status.pendente, r:'Pendentes', obs:'aguardando revisão'},
    {n:s.por_status.revisado, r:'Revisados', obs:'prontos para gravar', cls:'verde'},
    {n:s.obras_novas, r:'Obras novas', obs:'viram ficha nova'},
    {n:s.ja_no_acervo, r:'Já no acervo', obs:'viram só exemplar', cls:s.ja_no_acervo?'verde':''},
    {n:alertas, r:'Precisam de atenção', obs:`${s.sem_metadados} sem título · ${s.isbn_repetido} ISBN repetido`, cls:alertas?'alerta':''},
    {n:s.por_status.exportado, r:'Exportados', obs:'já no BibLivre'},
  ];
  $('tiles').innerHTML=t.map(x=>`<div class="tile ${x.cls||''}"><div class="n">${x.n}</div><div class="r">${x.r}</div><div class="obs">${x.obs}</div></div>`).join('');
  $('chips').innerHTML=ESTADOS.map(([k,rot])=>{
    const c=k==='todos'?s.total:(s.por_status[k]||0);
    return `<button class="chip ${filtro===k?'ativo':''}" onclick="setFiltro('${k}')">${rot}<span class="c">${c}</span></button>`;
  }).join('');
}

function setFiltro(f){ filtro=f; limparSelecao(); pintarTiles(); pintar(); }

// ---------- lista ----------
function visiveis(){
  const q=$('busca').value.trim().toLowerCase();
  const soAcervo=$('so-acervo').checked;
  let v=itens.filter(i=>{
    if(filtro!=='todos' && (i.status||'pendente')!==filtro) return false;
    if(soAcervo && !(i.acervo&&i.acervo.existe)) return false;
    if(q && !`${i.titulo||''} ${i.autor||''} ${i.editora||''} ${i.isbn||''} ${i.cdd||''}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const o=$('ordem').value;
  const cmp={
    recente:(a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''),
    antigo:(a,b)=>(a.timestamp||'').localeCompare(b.timestamp||''),
    titulo:(a,b)=>(a.titulo||'~').localeCompare(b.titulo||'~','pt-BR'),
    qtd:(a,b)=>(b.quantidade||1)-(a.quantidade||1),
    destino:(a,b)=>(!!(a.acervo&&a.acervo.existe))-(!!(b.acervo&&b.acervo.existe)),
  }[o];
  return v.sort(cmp);
}

function pintar(){
  const v=visiveis();
  const alvo=$('linhas');
  if(!v.length){
    alvo.innerHTML=`<div class="vazio"><div class="g">📭</div>${itens.length?'Nenhum item com esse filtro.':'A fila está vazia — escaneie livros no celular e envie o lote.'}</div>`;
  } else {
    alvo.innerHTML=v.map(linha).join('');
  }
  $('sel-todos').checked=v.length>0 && v.every(i=>selecao.has(i.id));
  pintarSelecao();
  pintarPrevia();
}

function destino(i){
  if(i.acervo&&i.acervo.existe){
    const q=i.quantidade||1, at=i.acervo.exemplares||0;
    return `<span class="b existe">+${q} exemplar${q>1?'es':''}</span><small>obra #${i.acervo.record_id} · tem ${at}</small>`;
  }
  if(!banco.indexados) return `<span class="b desconhecido">não verificado</span><small>banco desconectado</small>`;
  return `<span class="b nova">obra nova</span><small>vira ficha + ${i.quantidade||1} exemplar${(i.quantidade||1)>1?'es':''}</small>`;
}

function linha(i){
  const st=i.status||'pendente', sel=selecao.has(i.id);
  const capa=i.capa?`<img class="capa" src="${esc(i.capa)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'capa vazia',textContent:'📕'}))">`:`<div class="capa vazia">📕</div>`;
  const tit=(i.titulo||'').trim();
  const corpo=`<div class="linha ${sel?'sel':''} ${st}" data-id="${i.id}">
    <span><input type="checkbox" ${sel?'checked':''} onchange="marcar('${i.id}',this.checked)"></span>
    <span>${capa}</span>
    <div style="min-width:0">
      <div class="titulo ${tit?'':'faltando'}" title="${esc(tit)}">${esc(tit||'— sem metadados —')}</div>
      <div class="sub">${esc(i.autor||'autor não informado')}${i.editora?' · '+esc(i.editora):''}${i.ano?' · '+esc(i.ano):''}</div>
    </div>
    <div><div class="isbn">${esc(i.isbn||'—')}</div><div class="fonte">${esc(i.fonte||'')}</div></div>
    <div class="destino">${destino(i)}</div>
    <div class="qtd">
      <button onclick="mudarQtd('${i.id}',-1)" ${st==='exportado'?'disabled':''}>−</button>
      <input type="number" min="1" value="${i.quantidade||1}" onchange="setQtd('${i.id}',this.value)" ${st==='exportado'?'disabled':''}>
      <button onclick="mudarQtd('${i.id}',1)" ${st==='exportado'?'disabled':''}>+</button>
    </div>
    <span><span class="est ${st}">${st}</span></span>
    <div class="acoes">
      <button class="icone" title="Editar metadados" onclick="editar('${i.id}')">✎</button>
      <button class="icone" title="${st==='revisado'?'Voltar a pendente':'Marcar como revisado'}" onclick="alternar('${i.id}')">${st==='revisado'?'↺':'✓'}</button>
      <button class="icone perigo" title="Remover da fila" onclick="remover('${i.id}')">🗑</button>
    </div>
  </div>`;
  return editando===i.id ? corpo+editor(i) : corpo;
}

const CAMPOS=[['titulo','Título'],['subtitulo','Subtítulo'],['autor','Autor'],['editora','Editora'],['ano','Ano'],['edicao','Edição'],['paginas','Páginas'],['idioma','Idioma'],['isbn','ISBN'],['cdd','CDD'],['cutter','Cutter'],['localizacao','Localização']];

function editor(i){
  return `<div class="editor">
    <div class="grade">${CAMPOS.map(([k,r])=>`<div class="campo"><label>${r}</label><input id="ed-${k}" value="${esc(i[k]||'')}"></div>`).join('')}</div>
    <div class="editor-pe">
      <span style="font-size:12px;color:var(--txt3)">Editar o ISBN faz o sistema reconsultar o acervo.</span>
      <span class="sep"></span>
      <button class="btn pequeno" onclick="editando=null;pintar()">Cancelar</button>
      <button class="btn pequeno ok" onclick="salvar('${i.id}')">Salvar</button>
    </div>
  </div>`;
}

// ---------- acoes de item ----------
function editar(id){ editando = editando===id?null:id; pintar(); }

async function salvar(id){
  const dados={}; CAMPOS.forEach(([k])=>dados[k]=$('ed-'+k).value);
  const r=await fetch('/api/fila/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)}).then(r=>r.json());
  if(r.status==='ok'){ Object.assign(itens.find(x=>x.id===id), r.item); editando=null; msg('Item salvo.','ok'); await atualizarStats(); pintar(); }
  else msg('Não foi possível salvar.','erro');
}

async function alternar(id){
  const i=itens.find(x=>x.id===id);
  await mudarStatus([id], i.status==='revisado'?'pendente':'revisado');
}

async function remover(id){
  const i=itens.find(x=>x.id===id);
  if(!confirm(`Remover "${i.titulo||i.isbn}" da fila?`)) return;
  await fetch('/api/fila/'+id,{method:'DELETE'});
  itens=itens.filter(x=>x.id!==id); selecao.delete(id);
  msg('Removido da fila.','ok'); await atualizarStats(); pintar();
}

function mudarQtd(id,d){
  const i=itens.find(x=>x.id===id);
  setQtd(id, Math.max(1,(i.quantidade||1)+d));
}

let debQtd={};
async function setQtd(id,valor){
  const q=Math.max(1,parseInt(valor)||1);
  const i=itens.find(x=>x.id===id); i.quantidade=q; i.exemplares=q;
  pintar();
  clearTimeout(debQtd[id]);
  debQtd[id]=setTimeout(async()=>{
    await fetch('/api/fila/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({quantidade:q})});
    await atualizarStats(); pintarTiles(); pintarPrevia();
  },400);
}

async function mudarStatus(ids,acao){
  await fetch('/api/fila/acoes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,acao})});
  ids.forEach(id=>{ const i=itens.find(x=>x.id===id); if(i) i.status=acao; });
  await atualizarStats(); pintarTiles(); pintar();
}

async function atualizarStats(){ stats=await fetch('/api/fila/stats').then(r=>r.json()); pintarTiles(); }

// ---------- selecao ----------
function marcar(id,on){ on?selecao.add(id):selecao.delete(id); pintar(); }
function selecionarTodos(on){ visiveis().forEach(i=>on?selecao.add(i.id):selecao.delete(i.id)); pintar(); }
function limparSelecao(){ selecao.clear(); pintar(); }
function pintarSelecao(){
  $('sel-n').textContent=selecao.size;
  $('barra-sel').classList.toggle('on', selecao.size>0);
}
async function acao(a){
  const ids=[...selecao];
  if(a==='remover' && !confirm(`Remover ${ids.length} item(ns) da fila? Isso apaga os arquivos em data/fila.`)) return;
  if(a==='remover'){
    await fetch('/api/fila/acoes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,acao:'remover'})});
    itens=itens.filter(x=>!selecao.has(x.id));
  } else {
    await mudarStatus(ids,a);
  }
  selecao.clear(); await atualizarStats(); pintar();
  msg(`${ids.length} item(ns) atualizados.`,'ok');
}

// ---------- export ----------
function alvoExport(){
  if(selecao.size) return itens.filter(i=>selecao.has(i.id) && i.status!=='exportado');
  return itens.filter(i=>i.status==='pendente'||i.status==='revisado');
}

function pintarPrevia(){
  const a=alvoExport();
  const nov=a.filter(i=>!(i.acervo&&i.acervo.existe)).length;
  const ex=a.length-nov;
  const total=a.reduce((s,i)=>s+(i.quantidade||1),0);
  $('previa').innerHTML=a.length
    ? `<b>${a.length}</b> item(ns)${selecao.size?' (seleção)':''} → <b>${nov}</b> obra(s) nova(s) · <b>${ex}</b> já no acervo · <b>${total}</b> exemplar(es)`
    : 'Nada a exportar';
  $('btn-exportar').disabled=!a.length;
}

function confirmarExport(){
  const a=alvoExport(), executar=$('executar').checked;
  const nov=a.filter(i=>!(i.acervo&&i.acervo.existe));
  const ex=a.filter(i=>i.acervo&&i.acervo.existe);
  if(executar && !$('senha').value){ msg('Informe a senha do Postgres para gravar.','erro'); $('senha').focus(); return; }
  $('exp-titulo').textContent = executar?'Gravar no BibLivre':'Gerar arquivos de conferência';
  $('exp-dica').textContent = executar
    ? 'Vai escrever no banco agora, numa transação só. Obras novas exigem reindexar depois.'
    : 'Só gera obras.mrc e exemplares.csv em data/export. Nada é escrito no banco.';
  let h=`<div class="l"><span>Obras novas (viram ficha nova)</span><b>${nov.length}</b></div>
         <div class="l"><span>Já no acervo (só ganham exemplar)</span><b>${ex.length}</b></div>
         <div class="l"><span>Total de exemplares</span><b>${a.reduce((s,i)=>s+(i.quantidade||1),0)}</b></div>`;
  if(ex.length) h+=`<div style="margin-top:10px;color:var(--txt3);font-size:11px;text-transform:uppercase;letter-spacing:.5px">Exemplares acrescentados</div>`+
    ex.map(i=>`<div class="l"><span>${esc((i.titulo||i.isbn).slice(0,46))}</span><b>#${i.acervo.record_id} +${i.quantidade||1}</b></div>`).join('');
  if(!banco.indexados) h+=`<div style="margin-top:10px;color:var(--ambar)">⚠ Banco desconectado: nenhum ISBN foi verificado contra o acervo, então tudo entra como obra nova. Conecte antes de gravar.</div>`;
  $('exp-resumo').innerHTML=h;
  $('exp-ok').textContent = executar?'Gravar agora':'Gerar arquivos';
  $('exp-ok').className = executar?'btn ok':'btn primario';
  $('modal-export').classList.add('on');
}

async function exportar(){
  fechar('modal-export');
  const executar=$('executar').checked, senha=$('senha').value;
  const ids=selecao.size?[...selecao]:null;
  msg(executar?'Gravando no BibLivre…':'Gerando arquivos…');
  $('btn-exportar').disabled=true;
  try{
    const r=await fetch('/api/fila/exportar-biblivre',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({executar, ids, db:{senha}})}).then(r=>r.json());
    if(r.status==='vazio'){ msg('Nada para exportar.','erro'); }
    else if(r.status==='senha_requerida'){ msg(r.mensagem,'aviso'); }
    else if(r.status==='gerado_sem_inserir'){ msg(r.mensagem,'erro'); }
    else {
      let t=r.mensagem||'Concluído.';
      if(r.reindex_necessario) t+=' → Administração → Manutenção → Reindexar.';
      msg(t,'ok');
      baixarConferencia(r);
    }
    selecao.clear();
    await recarregar(false);
  }catch(e){ msg('Erro: '+e.message,'erro'); }
  $('btn-exportar').disabled=false;
}

function baixarConferencia(r){
  const blob=new Blob([JSON.stringify(r,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='conferencia_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'')+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}

// ---------- banco ----------
function abrirBanco(){
  const c=banco.cfg||{};
  if(c.host) $('db-host').value=c.host;
  if(c.dbname) $('db-nome').value=c.dbname;
  if(c.user) $('db-user').value=c.user;
  if(c.schema) $('db-schema').value=c.schema;
  $('db-msg').textContent = banco.erro ? '⚠ '+banco.erro : (banco.indexados?`Conectado — ${banco.indexados} ISBNs indexados.`:'');
  $('modal-banco').classList.add('on');
  $('db-senha').focus();
}

async function conectarBanco(){
  $('db-msg').textContent='Conectando e varrendo o acervo…';
  const corpo={host:$('db-host').value,dbname:$('db-nome').value,user:$('db-user').value,schema:$('db-schema').value,senha:$('db-senha').value};
  const r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)}).then(r=>r.json());
  if(r.status==='ok'){
    $('db-msg').innerHTML=`<span style="color:var(--verde)">✓ ${r.obras.toLocaleString('pt-BR')} obras, ${r.exemplares.toLocaleString('pt-BR')} exemplares. `+
      `Fila reavaliada: ${r.fila.no_acervo} de ${r.fila.avaliados} já estão no acervo.</span>`;
    $('senha').value=$('db-senha').value;
    await recarregar(false);
    setTimeout(()=>fechar('modal-banco'),1800);
  } else {
    $('db-msg').innerHTML=`<span style="color:var(--vermelho)">✗ ${esc(r.erro||'falha ao conectar')}</span>`;
  }
}

// ---------- utilidades ----------
function fechar(id){ $(id).classList.remove('on'); }
let tMsg;
function msg(t,cls){ $('msg').textContent=t; $('msg').className=cls||''; clearTimeout(tMsg); if(cls==='ok') tMsg=setTimeout(()=>{$('msg').textContent=''},6000); }

$('busca').addEventListener('input',()=>pintar());
$('so-acervo').addEventListener('change',()=>pintar());
$('ordem').addEventListener('change',()=>pintar());
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ document.querySelectorAll('.modal.on').forEach(m=>m.classList.remove('on')); if(editando){editando=null;pintar();} }
  if(e.key==='/' && e.target.tagName!=='INPUT'){ e.preventDefault(); $('busca').focus(); }
  if(e.key==='a' && (e.ctrlKey||e.metaKey) && e.target.tagName!=='INPUT'){ e.preventDefault(); selecionarTodos(true); }
});

recarregar(false);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Catalogacao ISBN</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #16213e;
            padding: 12px 16px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 2px solid #0f3460;
        }
        #qr-section {
            background: #16213e;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        #qr-section h2 {
            font-size: 14px;
            color: #3498db;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #qr-container {
            display: inline-block;
            background: white;
            padding: 12px;
            border-radius: 12px;
        }
        #qr-container img { display: block; width: 180px; height: 180px; }
        #qr-url {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            word-break: break-all;
            font-family: monospace;
        }
        #qr-instrucoes {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
        }
        #toggle-qr {
            margin-top: 10px;
            background: none;
            border: 1px solid #555;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        #main-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Preview da foto */
        #preview-container {
            flex: 1;
            position: relative;
            background: #000;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #preview-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #inicio-msg {
            position: absolute;
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 20px;
        }

        /* ISBN detectado */
        #isbn-detectado {
            display: none;
            background: #0f3460;
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        #isbn-detectado.visivel { display: block; }
        #isbn-detectado .isbn-numero {
            font-size: 24px;
            font-weight: 700;
            color: #2ecc71;
            font-family: monospace;
            letter-spacing: 2px;
        }
        #isbn-detectado .isbn-label {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* Resultado */
        #resultado {
            display: none;
            background: #1a1a2e;
            padding: 16px;
            border-top: 1px solid #333;
        }
        #resultado.visivel { display: block; }
        .livro-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .livro-capa {
            width: 80px;
            height: 120px;
            background: #333;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .livro-info { flex: 1; }
        .livro-titulo {
            font-size: 16px;
            font-weight: 600;
            color: #eee;
            margin-bottom: 4px;
        }
        .livro-autor {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 2px;
        }
        .livro-meta {
            font-size: 12px;
            color: #666;
        }
        .livro-fonte {
            display: inline-block;
            margin-top: 6px;
            font-size: 10px;
            color: #3498db;
            background: rgba(52,152,219,0.15);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .campo-extra {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-top: 1px solid #222;
            font-size: 13px;
        }
        .campo-extra-label { color: #888; }
        .campo-extra-valor { color: #ccc; }

        /* Controls */
        #controls {
            padding: 16px;
            background: #16213e;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #status-msg {
            text-align: center;
            font-size: 14px;
            color: #aaa;
            min-height: 20px;
        }
        #status-msg.erro { color: #e74c3c; }
        #status-msg.ok { color: #2ecc71; }
        .botoes-row {
            display: flex;
            gap: 10px;
        }
        .botoes-row button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        #escanear-btn { background: #2ecc71; color: white; }
        #escanear-btn:active { background: #27ae60; }
        #cadastrar-btn { background: #3498db; color: white; display: none; }
        #cadastrar-btn:active { background: #2980b9; }
        #novo-btn { background: #555; color: #ccc; display: none; }
        #novo-btn:active { background: #666; }
        #foto-input { display: none; }
        @media (min-width: 768px) {
            body { flex-direction: row; }
            header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; }
            #qr-section {
                width: 350px;
                min-height: 100vh;
                border-bottom: none;
                border-right: 1px solid #333;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding-top: 50px;
            }
            #main-section { flex: 1; margin-top: 40px; }
        }
        @media (max-width: 767px) {
            #qr-section { display: none; }
            #qr-section.visivel { display: block; }
        }
    </style>
</head>
<body>
    <header>Catalogacao ISBN — Biblioteca</header>

    <div id="qr-section">
        <h2>Abra no celular</h2>
        <div id="qr-container">
            <img src="/api/qrcode" alt="QR Code">
        </div>
        <div id="qr-url">{{SERVER_URL}}</div>
        <div id="qr-instrucoes">Escaneie com a camera do celular</div>
        <button id="toggle-qr" onclick="toggleQR()">Mostrar/Esconder</button>
    </div>

    <div id="main-section">
        <div id="preview-container">
            <img id="preview-img" style="display:none">
            <div id="inicio-msg">Toque em Escanear para tirar a foto do codigo de barras</div>
        </div>

        <div id="isbn-detectado">
            <div class="isbn-label">ISBN detectado</div>
            <div class="isbn-numero" id="isbn-numero"></div>
        </div>

        <div id="resultado">
            <div class="livro-header">
                <img class="livro-capa" id="livro-capa" src="" style="display:none">
                <div class="livro-info">
                    <div class="livro-titulo" id="livro-titulo">—</div>
                    <div class="livro-autor" id="livro-autor">—</div>
                    <div class="livro-meta" id="livro-meta">—</div>
                    <div class="livro-fonte" id="livro-fonte"></div>
                </div>
            </div>
            <div class="campo-extra">
                <span class="campo-extra-label">Editora</span>
                <span class="campo-extra-valor" id="campo-editora">—</span>
            </div>
            <div class="campo-extra">
                <span class="campo-extra-label">Ano</span>
                <span class="campo-extra-valor" id="campo-ano">—</span>
            </div>
            <div class="campo-extra">
                <span class="campo-extra-label">Paginas</span>
                <span class="campo-extra-valor" id="campo-paginas">—</span>
            </div>
            <div class="campo-extra">
                <span class="campo-extra-label">Idioma</span>
                <span class="campo-extra-valor" id="campo-idioma">—</span>
            </div>
        </div>

        <div id="controls">
            <div id="status-msg"></div>
            <input type="file" id="foto-input" accept="image/*" capture="environment">
            <div class="botoes-row">
                <button id="escanear-btn" onclick="abrirCamera()">Escanear</button>
                <button id="cadastrar-btn" onclick="cadastrar()">Cadastrar</button>
                <button id="novo-btn" onclick="novo()">Novo livro</button>
            </div>
        </div>
    </div>

    <script>
        const statusMsg = document.getElementById('status-msg');
        const isbnDetectado = document.getElementById('isbn-detectado');
        const isbnNumero = document.getElementById('isbn-numero');
        const resultado = document.getElementById('resultado');
        const escanearBtn = document.getElementById('escanear-btn');
        const cadastrarBtn = document.getElementById('cadastrar-btn');
        const novoBtn = document.getElementById('novo-btn');
        const previewImg = document.getElementById('preview-img');
        const inicioMsg = document.getElementById('inicio-msg');
        const fotoInput = document.getElementById('foto-input');

        let ultimoISBN = null;
        let ultimoDados = null;

        function toggleQR() {
            document.getElementById('qr-section').classList.toggle('visivel');
        }

        function setStatus(msg, tipo) {
            statusMsg.textContent = msg;
            statusMsg.className = tipo || '';
        }

        function abrirCamera() {
            fotoInput.value = '';
            fotoInput.click();
        }

        fotoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Mostrar preview
            const url = URL.createObjectURL(file);
            previewImg.src = url;
            previewImg.style.display = 'block';
            inicioMsg.style.display = 'none';

            setStatus('Decodificando codigo de barras...', '');

            // Decodificar ISBN da imagem
            const isbn = await decodificarISBN(file);
            if (!isbn) {
                setStatus('Codigo de barras nao detectado. Tente mais perto ou melhore a iluminacao.', 'erro');
                escanearBtn.style.display = '';
                cadastrarBtn.style.display = 'none';
                novoBtn.style.display = 'none';
                return;
            }

            ultimoISBN = isbn;
            isbnNumero.textContent = isbn;
            isbnDetectado.classList.add('visivel');

            // Buscar metadados
            setStatus('Buscando metadados...', '');
            try {
                const resp = await fetch('/api/lookup/' + isbn);
                const dados = await resp.json();
                ultimoDados = dados;
                mostrarResultado(dados);
            } catch (err) {
                setStatus('Erro de conexao: ' + err.message, 'erro');
            }
        });

        async function decodificarISBN(file) {
            try {
                const html5QrCode = new Html5Qrcode("preview-container");
                const resultado = await html5QrCode.scanFile(file, true);
                // Validar se e ISBN (10 ou 13 digitos)
                const limpo = resultado.replace(/[\s\-]/g, '');
                if (/^\d{10}(\d{3})?$/.test(limpo)) {
                    return limpo;
                }
                return null;
            } catch (err) {
                return null;
            }
        }

        function mostrarResultado(dados) {
            if (dados.status === 'nao_encontrado') {
                setStatus(dados.mensagem, 'erro');
                cadastrarBtn.style.display = '';
                novoBtn.style.display = '';
                return;
            }

            setStatus('Livro encontrado!', 'ok');

            document.getElementById('livro-titulo').textContent = dados.titulo || '—';
            document.getElementById('livro-autor').textContent = dados.autor || '—';

            let meta = [];
            if (dados.ano) meta.push(dados.ano);
            if (dados.edicao) meta.push(dados.edicao + ' ed.');
            if (dados.paginas) meta.push(dados.paginas + ' p.');
            document.getElementById('livro-meta').textContent = meta.join(' | ') || '—';

            document.getElementById('campo-editora').textContent = dados.editora || '—';
            document.getElementById('campo-ano').textContent = dados.ano || '—';
            document.getElementById('campo-paginas').textContent = dados.paginas || '—';
            document.getElementById('campo-idioma').textContent = dados.idioma || '—';

            document.getElementById('livro-fonte').textContent = dados.fonte || '';

            const capa = document.getElementById('livro-capa');
            if (dados.capa) {
                capa.src = dados.capa;
                capa.style.display = '';
            } else {
                capa.style.display = 'none';
            }

            resultado.classList.add('visivel');
            cadastrarBtn.style.display = '';
            novoBtn.style.display = '';
        }

        async function cadastrar() {
            if (!ultimoDados && !ultimoISBN) return;
            setStatus('Salvando...', '');

            const item = ultimoDados || { isbn: ultimoISBN, status: 'incompleto' };

            try {
                await fetch('/api/confirmar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(item)
                });
                setStatus('Cadastrado na fila de revisao!', 'ok');
                cadastrarBtn.style.display = 'none';
            } catch (err) {
                setStatus('Erro ao salvar: ' + err.message, 'erro');
            }
        }

        function novo() {
            ultimoISBN = null;
            ultimoDados = null;
            isbnDetectado.classList.remove('visivel');
            resultado.classList.remove('visivel');
            previewImg.style.display = 'none';
            inicioMsg.style.display = '';
            cadastrarBtn.style.display = 'none';
            novoBtn.style.display = 'none';
            escanearBtn.style.display = '';
            setStatus('', '');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Catalogacao ISBN — Carrinho</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;display:flex;flex-direction:column}
        header{background:#16213e;padding:12px 16px;text-align:center;font-size:16px;font-weight:600;border-bottom:2px solid #0f3460}
        #qr-section{background:#16213e;padding:20px;text-align:center;border-bottom:1px solid #333}
        #qr-section h2{font-size:14px;color:#3498db;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
        #qr-container{display:inline-block;background:white;padding:12px;border-radius:12px}
        #qr-container img{display:block;width:180px;height:180px}
        #qr-url{margin-top:10px;font-size:12px;color:#888;word-break:break-all;font-family:monospace}
        #qr-instrucoes{margin-top:10px;font-size:13px;color:#aaa}
        #toggle-qr{margin-top:10px;background:none;border:1px solid #555;color:#aaa;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px}
        #main-section{flex:1;display:flex;flex-direction:column;min-height:0}
        #scanner-container{flex:1;position:relative;background:#000;min-height:280px}
        #scanner-reader{width:100%;height:100%}
        #scanner-reader video{width:100%!important;height:100%!important;object-fit:cover!important}
        #scanner-status{position:absolute;bottom:0;left:0;right:0;padding:10px;background:rgba(0,0,0,.7);text-align:center;font-size:13px;color:#aaa;z-index:5}
        #scanner-status.ok{color:#2ecc71}
        /* Carrinho — galeria que acumula */
        #carrinho-bar{display:none;background:#0f2040;border-top:2px solid #3498db;padding:10px}
        #carrinho-bar.visivel{display:block}
        #carrinho-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        #carrinho-head h3{font-size:12px;color:#3498db;text-transform:uppercase;letter-spacing:1px}
        #carrinho-count{background:#3498db;color:#fff;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700}
        #carrinho-lista{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
        .cart-item{min-width:140px;max-width:160px;background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:8px;scroll-snap-align:start;position:relative;animation:pop .25s ease}
        @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
        .cart-item .ci-isbn{font-family:monospace;font-size:11px;color:#2ecc71;word-break:break-all}
        .cart-item .ci-titulo{font-size:11px;color:#eee;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .cart-item .ci-autor{font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .cart-item .ci-fonte{font-size:9px;color:#3498db;margin-top:4px}
        .cart-item .ci-remove{position:absolute;top:4px;right:4px;background:rgba(231,76,60,.9);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer}
        .cart-item.buscando{opacity:.6}
        .cart-item.duplicado{border-color:#f39c12}
        /* Resultado detalhado do ultimo */
        #resultado{display:none;background:#1a1a2e;padding:12px;border-top:1px solid #333}
        #resultado.visivel{display:block}
        .livro-header{display:flex;gap:12px}
        .livro-capa{width:64px;height:96px;background:#333;border-radius:6px;object-fit:cover;flex-shrink:0}
        .livro-info{flex:1;min-width:0}
        .livro-titulo{font-size:14px;font-weight:600}
        .livro-autor{font-size:12px;color:#aaa}
        .livro-meta{font-size:11px;color:#666}
        .livro-fonte{font-size:10px;color:#3498db;background:rgba(52,152,219,.15);padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px}
        /* Controls */
        #controls{padding:12px;background:#16213e;display:flex;flex-direction:column;gap:8px}
        #status-msg{text-align:center;font-size:13px;color:#aaa;min-height:18px}
        #status-msg.erro{color:#e74c3c}#status-msg.ok{color:#2ecc71}
        .botoes-row{display:flex;gap:8px}
        .botoes-row button{flex:1;padding:14px;font-size:15px;font-weight:600;border:none;border-radius:12px;cursor:pointer}
        #escanear-btn{background:#2ecc71;color:#fff}#escanear-btn:active{background:#27ae60}
        #parar-btn{background:#e74c3c;color:#fff;display:none}#parar-btn:active{background:#c0392b}
        #enviar-btn{background:#3498db;color:#fff;display:none}#enviar-btn:active{background:#2980b9}#enviar-btn:disabled{background:#555}
        #limpar-btn{background:#555;color:#ccc;display:none;font-size:13px}
        @media(min-width:768px){
            body{flex-direction:row}
            header{position:fixed;top:0;left:0;right:0;z-index:10}
            #qr-section{width:340px;min-height:100vh;border-bottom:none;border-right:1px solid #333;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:50px}
            #main-section{flex:1;margin-top:40px}
        }
        @media(max-width:767px){
            #qr-section{display:none}#qr-section.visivel{display:block}
        }
    </style>
</head>
<body>
<header>Catalogacao ISBN — Carrinho</header>
<div id="qr-section">
    <h2>Abra no celular</h2>
    <div id="qr-container"><img src="/api/qrcode" alt="QR Code"></div>
    <div id="qr-url">{{SERVER_URL}}</div>
    <div id="qr-instrucoes">Escaneie com a camera do celular</div>
    <button id="toggle-qr" onclick="document.getElementById('qr-section').classList.toggle('visivel')">Mostrar/Esconder</button>
</div>
<div id="main-section">
    <div id="scanner-container">
        <div id="scanner-reader"></div>
        <div id="scanner-status">Toque em Escanear para iniciar — modo continuo</div>
    </div>
    <!-- Carrinho que acumula, como galeria do scanner de documentos -->
    <div id="carrinho-bar">
        <div id="carrinho-head">
            <h3>Carrinho</h3>
            <div style="display:flex;gap:8px;align-items:center">
                <span id="carrinho-count">0</span>
                <button id="limpar-btn" onclick="limparCarrinho()">Limpar</button>
            </div>
        </div>
        <div id="carrinho-lista"></div>
    </div>
    <div id="resultado">
        <div class="livro-header">
            <img class="livro-capa" id="livro-capa" src="" style="display:none">
            <div class="livro-info">
                <div class="livro-titulo" id="livro-titulo">—</div>
                <div class="livro-autor" id="livro-autor">—</div>
                <div class="livro-meta" id="livro-meta">—</div>
                <div class="livro-fonte" id="livro-fonte"></div>
            </div>
        </div>
    </div>
    <div id="controls">
        <div id="status-msg"></div>
        <div class="botoes-row">
            <button id="escanear-btn" onclick="iniciarScanner()">Escanear</button>
            <button id="parar-btn" onclick="pararScanner()">Parar</button>
            <button id="enviar-btn" onclick="enviarCarrinho()">Enviar para catalogacao</button>
        </div>
    </div>
</div>
<script>
const statusMsg=document.getElementById('status-msg');
const scannerStatus=document.getElementById('scanner-status');
const escanearBtn=document.getElementById('escanear-btn');
const pararBtn=document.getElementById('parar-btn');
const enviarBtn=document.getElementById('enviar-btn');
const limparBtn=document.getElementById('limpar-btn');
const carrinhoBar=document.getElementById('carrinho-bar');
const carrinhoLista=document.getElementById('carrinho-lista');
const carrinhoCount=document.getElementById('carrinho-count');
const resultado=document.getElementById('resultado');

let scanner=null, escaneando=false;
let vistos=new Set(); // deduplicacao local imediata
let carrinho=[];

function setStatus(m,t){statusMsg.textContent=m;statusMsg.className=t||''}

function renderCarrinho(){
    carrinhoLista.innerHTML='';
    carrinho.forEach(item=>{
        const div=document.createElement('div');
        div.className='cart-item'+(item.status==='buscando'?' buscando':'');
        div.innerHTML=`<button class="ci-remove" onclick="removerDoCarrinho('${item.isbn}')">×</button>
            <div class="ci-isbn">${item.isbn}</div>
            <div class="ci-titulo">${item.titulo|| (item.status==='buscando'?'buscando...': '—')}</div>
            <div class="ci-autor">${item.autor||''}</div>
            <div class="ci-fonte">${item.fonte||''}${item.status==='duplicado'?' • duplicado':''}</div>`;
        carrinhoLista.appendChild(div);
    });
    carrinhoCount.textContent=carrinho.length;
    const visivel=carrinho.length>0;
    carrinhoBar.classList.toggle('visivel',visivel);
    enviarBtn.style.display=visivel?'':'none';
    limparBtn.style.display=visivel?'':'none';
    if(visivel) carrinhoLista.scrollLeft=carrinhoLista.scrollWidth;
}

async function adicionarAoCarrinho(isbn){
    if(vistos.has(isbn)){ setStatus('Ja no carrinho: '+isbn,'erro'); vibrar(); return; }
    vistos.add(isbn);
    const placeholder={isbn,titulo:'',autor:'',fonte:'',status:'buscando'};
    carrinho.push(placeholder);
    renderCarrinho();
    scannerStatus.textContent='Adicionado: '+isbn;
    scannerStatus.className='ok';
    vibrar();
    try{
        const resp=await fetch('/api/carrinho',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({isbn})});
        const data=await resp.json();
        // data: {status, item, total} — item contem titulo/autor/fonte
        const idx=carrinho.findIndex(x=>x.isbn===isbn);
        if(idx>=0){
            if(data.status==='duplicado'){ carrinho[idx].status='duplicado'; }
            else if(data.item){ Object.assign(carrinho[idx], data.item); delete carrinho[idx].status; }
            renderCarrinho();
            mostrarDetalhe(carrinho[idx]);
        }
        setStatus(`Carrinho: ${carrinho.length} livro(s)`, 'ok');
    }catch(e){ setStatus('Erro ao adicionar: '+e.message,'erro'); }
}

function vibrar(){ if(navigator.vibrate) navigator.vibrate(60); }

function mostrarDetalhe(d){
    document.getElementById('livro-titulo').textContent=d.titulo||'—';
    document.getElementById('livro-autor').textContent=d.autor||'—';
    let meta=[]; if(d.ano) meta.push(d.ano); if(d.paginas) meta.push(d.paginas+' p.');
    document.getElementById('livro-meta').textContent=meta.join(' | ')||d.isbn||'—';
    document.getElementById('livro-fonte').textContent=d.fonte||'';
    const capa=document.getElementById('livro-capa');
    if(d.capa){capa.src=d.capa; capa.style.display='';} else capa.style.display='none';
    resultado.classList.add('visivel');
}

async function removerDoCarrinho(isbn){
    carrinho=carrinho.filter(x=>x.isbn!==isbn);
    vistos.delete(isbn);
    renderCarrinho();
    if(carrinho.length===0) resultado.classList.remove('visivel');
    await fetch('/api/carrinho/'+encodeURIComponent(isbn),{method:'DELETE'});
}

async function limparCarrinho(){
    carrinho=[]; vistos.clear(); renderCarrinho(); resultado.classList.remove('visivel');
    await fetch('/api/carrinho',{method:'DELETE'});
    setStatus('Carrinho limpo','');
}

async function enviarCarrinho(){
    if(carrinho.length===0) return;
    enviarBtn.disabled=true; enviarBtn.textContent='Enviando...';
    try{
        const resp=await fetch('/api/carrinho/enviar',{method:'POST'});
        const data=await resp.json();
        setStatus(`Enviados ${data.enviados} livro(s) para a fila!`,'ok');
        carrinho=[]; vistos.clear(); renderCarrinho(); resultado.classList.remove('visivel');
    }catch(e){ setStatus('Erro ao enviar: '+e.message,'erro'); }
    enviarBtn.disabled=false; enviarBtn.textContent='Enviar para catalogacao';
}

function iniciarScanner(){
    if(escaneando) return;
    scanner=new Html5Qrcode("scanner-reader");
    escaneando=true;
    escanearBtn.style.display='none'; pararBtn.style.display='';
    scannerStatus.textContent='Procurando codigo de barras...'; scannerStatus.className='';
    // Carregar carrinho existente
    fetch('/api/carrinho').then(r=>r.json()).then(d=>{
        if(d.itens) { d.itens.forEach(i=>vistos.add(i.isbn)); carrinho=d.itens; renderCarrinho(); }
    });
    scanner.start({facingMode:"environment"},{
        fps:10,
        qrbox:(w,h)=>{let m=Math.min(w,h);return{width:Math.floor(m*0.85),height:Math.floor(m*0.4)}},
        aspectRatio:1.0,
    }, onSucesso, ()=>{}).catch(err=>{
        setStatus('Erro camera: '+err,'erro');
        escaneando=false; escanearBtn.style.display=''; pararBtn.style.display='none';
    });
}
function pararScanner(){
    if(!scanner||!escaneando) return;
    scanner.stop().then(()=>{scanner.clear(); escaneando=false; escanearBtn.style.display=''; pararBtn.style.display='none'; scannerStatus.textContent='Scanner parado';});
}
async function onSucesso(text){
    const limpo=text.replace(/[\s\-]/g,'');
    if(!/^\d{10}(\d{3})?$/.test(limpo)) return;
    // debounce 1.5s ja esta no Set, mas evita spam do mesmo frame
    if(vistos.has(limpo)) return;
    await adicionarAoCarrinho(limpo);
}
</script>
</body>
</html>

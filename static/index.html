<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Catalogacao por Foto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #16213e;
            padding: 12px 16px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 2px solid #0f3460;
        }
        #qr-section {
            background: #16213e;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        #qr-section h2 {
            font-size: 14px;
            color: #3498db;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #qr-container {
            display: inline-block;
            background: white;
            padding: 12px;
            border-radius: 12px;
        }
        #qr-container img { display: block; width: 180px; height: 180px; }
        #qr-url {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            word-break: break-all;
            font-family: monospace;
        }
        #qr-instrucoes {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
        }
        #toggle-qr {
            margin-top: 10px;
            background: none;
            border: 1px solid #555;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        #camera-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #preview-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 300px;
        }
        #preview-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            height: 50%;
            border: 3px solid rgba(52, 152, 219, 0.8);
            border-radius: 8px;
            pointer-events: none;
        }
        #overlay-label {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(52, 152, 219, 0.9);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            white-space: nowrap;
        }
        #inicio-msg {
            position: absolute;
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 20px;
        }
        #controls {
            padding: 16px;
            background: #16213e;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #status {
            text-align: center;
            font-size: 14px;
            color: #aaa;
            min-height: 20px;
        }
        #status.erro { color: #e74c3c; }
        #status.ok { color: #2ecc71; }
        #capturar-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #3498db;
            color: white;
        }
        #capturar-btn:active { background: #2980b9; }
        #capturar-btn:disabled { background: #555; cursor: not-allowed; }
        #foto-input { display: none; }
        #resultado {
            display: none;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            margin-top: 4px;
        }
        #resultado.visivel { display: block; }
        #resultado h3 {
            font-size: 14px;
            color: #3498db;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .campo {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #222;
        }
        .campo:last-child { border-bottom: none; }
        .campo-label { color: #888; font-size: 13px; }
        .campo-valor {
            font-size: 14px;
            font-weight: 500;
            text-align: right;
            max-width: 60%;
            word-break: break-all;
        }
        .campo-valor.valido { color: #2ecc71; }
        .campo-valor.invalido { color: #e74c3c; }
        #ocr-texto {
            margin-top: 10px;
            padding: 8px;
            background: #111;
            border-radius: 6px;
            font-size: 11px;
            color: #888;
            max-height: 80px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        #botoes-resultado {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        #botoes-resultado button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        #confirmar-btn { background: #2ecc71; color: white; }
        #confirmar-btn:active { background: #27ae60; }
        #refazer-btn { background: #333; color: #ccc; }
        #refazer-btn:active { background: #444; }
        @media (min-width: 768px) {
            body { flex-direction: row; }
            header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; }
            #qr-section {
                width: 350px;
                min-height: 100vh;
                border-bottom: none;
                border-right: 1px solid #333;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding-top: 50px;
            }
            #camera-section { flex: 1; margin-top: 40px; }
        }
        @media (max-width: 767px) {
            #qr-section { display: none; }
            #qr-section.visivel { display: block; }
        }
    </style>
</head>
<body>
    <header>Catalogacao por Foto — Ficha CIP</header>

    <div id="qr-section">
        <h2>Abra no celular</h2>
        <div id="qr-container">
            <img src="/api/qrcode" alt="QR Code">
        </div>
        <div id="qr-url">{{SERVER_URL}}</div>
        <div id="qr-instrucoes">Escaneie com a camera do celular</div>
        <button id="toggle-qr" onclick="toggleQR()">Mostrar/Esconder</button>
    </div>

    <div id="camera-section">
        <div id="preview-container">
            <img id="preview" style="display:none">
            <div id="overlay">
                <div id="overlay-label">Alinhe a ficha aqui</div>
            </div>
            <div id="inicio-msg">Toque em Capturar para tirar a foto</div>
        </div>

        <div id="controls">
            <div id="status"></div>
            <div id="resultado">
                <h3>Campos extraidos</h3>
                <div class="campo">
                    <span class="campo-label">ISBN</span>
                    <span class="campo-valor" id="isbn-valor">—</span>
                </div>
                <div class="campo">
                    <span class="campo-label">CDD</span>
                    <span class="campo-valor" id="cdd-valor">—</span>
                </div>
                <div class="campo">
                    <span class="campo-label">Cutter</span>
                    <span class="campo-valor" id="cutter-valor">—</span>
                </div>
                <div id="ocr-texto"></div>
                <div id="botoes-resultado">
                    <button id="refazer-btn" onclick="refazer()">Refazer</button>
                    <button id="confirmar-btn" onclick="confirmar()">Confirmar</button>
                </div>
            </div>
            <input type="file" id="foto-input" accept="image/*" capture="environment">
            <button id="capturar-btn" onclick="abrirCamera()">Capturar</button>
        </div>
    </div>

    <script>
        const fotoInput = document.getElementById('foto-input');
        const preview = document.getElementById('preview');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const capturarBtn = document.getElementById('capturar-btn');
        const inicioMsg = document.getElementById('inicio-msg');

        let ultimoResultado = null;
        let processando = false;

        function toggleQR() {
            document.getElementById('qr-section').classList.toggle('visivel');
        }

        function abrirCamera() {
            if (processando) return;
            fotoInput.value = '';
            fotoInput.click();
        }

        fotoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            processando = true;
            capturarBtn.disabled = true;
            capturarBtn.textContent = 'Processando...';
            resultado.classList.remove('visivel');

            // Mostrar preview
            const url = URL.createObjectURL(file);
            preview.src = url;
            preview.style.display = 'block';
            inicioMsg.style.display = 'none';

            setStatus('Processando...', '');
            const formData = new FormData();
            formData.append('foto', file, 'captura.jpg');

            try {
                const resp = await fetch('/api/capturar', { method: 'POST', body: formData });
                const dados = await resp.json();
                mostrarResultado(dados);
            } catch (err) {
                setStatus('Erro de conexao: ' + err.message, 'erro');
            }

            processando = false;
            capturarBtn.disabled = false;
            capturarBtn.textContent = 'Capturar';
        });

        function mostrarResultado(dados) {
            ultimoResultado = dados;
            if (dados.status === 'erro') {
                setStatus(dados.mensagem, 'erro');
                resultado.classList.remove('visivel');
                return;
            }
            setStatus('Ficha detectada!', 'ok');
            const isbnEl = document.getElementById('isbn-valor');
            isbnEl.textContent = dados.isbn || 'Nao encontrado';
            isbnEl.className = 'campo-valor ' + (dados.isbn_valido ? 'valido' : dados.isbn ? 'invalido' : '');
            document.getElementById('cdd-valor').textContent = dados.cdd || 'Nao encontrado';
            document.getElementById('cutter-valor').textContent = dados.cutter || 'Nao encontrado';
            document.getElementById('ocr-texto').textContent = dados.texto_ocr || '';
            resultado.classList.add('visivel');
        }

        async function confirmar() {
            if (!ultimoResultado) return;
            setStatus('Salvando...', '');
            try {
                await fetch('/api/confirmar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ultimoResultado)
                });
                setStatus('Salvo na fila de revisao!', 'ok');
                resultado.classList.remove('visivel');
                ultimoResultado = null;
                preview.style.display = 'none';
                inicioMsg.style.display = '';
            } catch (err) {
                setStatus('Erro ao salvar: ' + err.message, 'erro');
            }
        }

        function refazer() {
            resultado.classList.remove('visivel');
            ultimoResultado = null;
            preview.style.display = 'none';
            inicioMsg.style.display = '';
            setStatus('', '');
        }

        function setStatus(msg, tipo) {
            status.textContent = msg;
            status.className = tipo || '';
        }
    </script>
</body>
</html>
